# Busylight - ESPHome firmware for Wemos D1 Mini + LED traffic light module
#
# Hardware wiring (module has onboard resistors, active HIGH):
#   Traffic light R   -> D5 (GPIO14)
#   Traffic light Y   -> D6 (GPIO12)
#   Traffic light G   -> D7 (GPIO13)
#   Traffic light GND -> G
#   TTP223 touch VCC  -> 3V3
#   TTP223 touch I/O  -> D8 (GPIO15) (default jumpers: momentary, active HIGH)
#     D8 is a boot strap pin that must be LOW at power-up. The TTP223 idles
#     LOW and the D1 Mini has a 10k pull-down, so this is fine as long as
#     the pad is not touched while the board powers up.
#   TTP223 touch GND  -> G
#
# Standalone build: no Wi-Fi, Home Assistant API, OTA, captive portal or
# Bluetooth. The ESP8266 radio stays off (Arduino core 3.x leaves Wi-Fi
# disabled at boot unless a component enables it). Updates require USB.
# The networked variant (old board at 192.168.50.182) is busylight-wifi.yaml
# in the esphome-configs repo.
#
# Touch button:
#   tap while Free, Away or Off -> Busy (red) until changed by hand.
#   tap while Busy              -> Free (green).
#   hold for 3 s                -> Away (amber).
# The internal "Status" select (Off / Free / Away / Busy) drives the lights.
#
# Presence after a power break. The light is powered from the monitor, so
# plugging a PC in or out of the screen power-cycles it. At boot it picks:
#   - Amber, if before the break it was red or green, or amber set by hand
#     (someone was at the desk, so the break means they left).
#   - Green, if before the break it was amber from the previous boot and
#     the button had not been touched (nobody was there, so the break
#     means a PC was just plugged in).
# This is one flag in flash, boot_green. Any button use clears it. Booting
# to amber sets it, booting to green clears it, but only after the light
# has been on for ${settle_seconds} s, so a plug-in that bounces the power
# twice doesn't flip it back and forth.

substitutions:
  device_name: busylight
  friendly_name: Busylight
  settle_seconds: "5"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Lights set up after the select and would override it, so apply the
  # startup colour once everything else has started.
  on_boot:
    priority: -100
    then:
      - select.set:
          id: status
          option: !lambda 'return id(boot_green) ? "Free" : "Away";'
      - delay: ${settle_seconds}s
      # Untouched since boot: the next power break means the opposite of
      # this one (see the presence notes at the top).
      - if:
          condition:
            lambda: return !id(touched_since_boot);
          then:
            - globals.set:
                id: boot_green
                value: !lambda 'return id(status).current_option() == "Away";'

esp8266:
  board: d1_mini
  restore_from_flash: true

# Save boot_green to flash as soon as it changes (default: once a minute),
# so it survives a power break right after a button press. It changes a few
# times a day at most, so flash wear doesn't matter.
preferences:
  flash_write_interval: 0s

globals:
  # Next power-up shows green (true) or amber (false).
  - id: boot_green
    type: bool
    restore_value: true
    initial_value: "false"
  - id: touched_since_boot
    type: bool
    restore_value: false
    initial_value: "false"

logger:
  baud_rate: 115200

# ---------------------------------------------------------------- outputs

output:
  - platform: gpio
    id: out_red
    pin: GPIO14 # D5
  - platform: gpio
    id: out_yellow
    pin: GPIO12 # D6
  - platform: gpio
    id: out_green
    pin: GPIO13 # D7

light:
  - platform: binary
    id: light_red
    name: Red
    output: out_red
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Blink
  - platform: binary
    id: light_yellow
    name: Yellow
    output: out_yellow
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Blink
  - platform: binary
    id: light_green
    name: Green
    output: out_green
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Blink

# ---------------------------------------------------------------- status

select:
  - platform: template
    id: status
    name: Status
    icon: mdi:traffic-light
    optimistic: true
    restore_value: false
    options:
      - "Off"
      - Free
      - Away
      - Busy
    initial_option: Away
    on_value:
      then:
        - lambda: |-
            auto set = [](light::LightState *l, bool on) {
              auto call = on ? l->turn_on() : l->turn_off();
              call.perform();
            };
            set(id(light_red), x == "Busy");
            set(id(light_yellow), x == "Away");
            set(id(light_green), x == "Free");

# ---------------------------------------------------------------- button actions

script:
  # Any button use means someone is at the desk: the next power break is
  # them leaving, so boot to amber.
  - id: mark_touched
    then:
      - globals.set:
          id: touched_since_boot
          value: "true"
      - globals.set:
          id: boot_green
          value: "false"

  - id: tap
    mode: single
    then:
      - script.execute: mark_touched
      - select.set:
          id: status
          option: !lambda 'return id(status).current_option() == "Busy" ? "Free" : "Busy";'

binary_sensor:
  - platform: gpio
    id: touch
    name: Touch
    pin: GPIO15 # D8
    filters:
      - delayed_on: 20ms
    # The TTP223 calibrates at power-up and can pulse its output, so touches
    # in the first 2 s after boot are ignored.
    on_multi_click:
      # Short tap (released within 1 s): red <-> green
      - timing:
          - ON for at most 1s
          - OFF for at least 50ms
        then:
          - if:
              condition:
                lambda: return millis() > 2000;
              then:
                - script.execute: tap
      # Long press (held 3 s): fires while still held
      - timing:
          - ON for at least 3s
        then:
          - if:
              condition:
                lambda: return millis() > 2000;
              then:
                - script.execute: mark_touched
                - select.set:
                    id: status
                    option: Away
